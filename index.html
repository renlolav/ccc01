<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>炫彩靈動 3D 展示相簿</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 靈動動態背景 */
    body {
      background: linear-gradient(-45deg, #0b0f19, #1b103a, #082032, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      margin-bottom: 15px;
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.4));
    }

    /* 3D 舞台 + 3D 浮動跳動動畫 */
    .stage {
      width: 240px;
      height: 320px;
      perspective: 800px;
      position: relative;
      cursor: grab;
      animation: floatStage 5s ease-in-out infinite;
      will-change: transform;
    }
    .stage:active {
      cursor: grabbing;
    }

    /* 上下浮動跳動感 */
    @keyframes floatStage {
      0%, 100% { transform: translateY(0px) rotateX(0deg); }
      50% { transform: translateY(-14px) rotateX(2deg); }
    }

    /* 旋轉容器 */
    .carousel {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    /* 卡片設計 */
    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      backface-visibility: hidden;
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(56, 189, 248, 0.6);
    }

    /* 完整呈現圖片全貌 */
    .card img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      pointer-events: auto;
      cursor: pointer;
    }

    /* 控制按鈕 */
    .controls {
      margin-top: 30px;
      display: flex;
      gap: 15px;
      z-index: 20;
    }

    button {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(168, 85, 247, 0.4));
      border: 1.5px solid rgba(56, 189, 248, 0.8);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, background 0.2s;
    }

    button:active {
      transform: scale(0.95);
    }

    .hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
    }

    /* 燈箱：點擊放大檢視 */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
    }

    /* 📱 手機端專屬縮放比例 */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.2rem;
        margin-bottom: 10px;
      }
      .stage {
        width: 180px;
        height: 250px;
        perspective: 600px;
      }
      button {
        padding: 8px 20px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <h1>PHOTO GALLERY</h1>

  <div class="stage" id="stage">
    <div class="carousel" id="carousel">
      <div class="card"><img src="photo1.jpg" alt="Photo 1" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo2.jpg" alt="Photo 2" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo3.jpg" alt="Photo 3" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo4.jpg" alt="Photo 4" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo5.jpg" alt="Photo 5" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo6.jpg" alt="Photo 6" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo7.jpg" alt="Photo 7" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo8.jpg" alt="Photo 8" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo9.jpg" alt="Photo 9" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo10.jpg" alt="Photo 10" onclick="openLightbox(this.src)"></div>
      <div class="card"><img src="photo11.jpg" alt="Photo 11" onclick="openLightbox(this.src)"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="rotateCarousel(-1)">◀ 上一張</button>
    <button onclick="rotateCarousel(1)">下一張 ▶</button>
  </div>

  <div class="hint">可左右滑動切換 ｜ 點擊圖片放大</div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Full Image">
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const stage = document.getElementById('stage');
    const cards = document.querySelectorAll('.card');
    const totalCards = cards.length;
    const angleStep = 360 / totalCards;
    
    // 自動根據螢幕寬度調整 3D 環狀半徑
    const isMobile = window.innerWidth <= 768;
    const radius = isMobile ? 280 : 380; 
    let currentIndex = 0;

    cards.forEach((card, index) => {
      const angle = index * angleStep;
      card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
    });

    function updateCarousel() {
      const angle = -currentIndex * angleStep;
      carousel.style.transform = `rotateY(${angle}deg)`;
    }

    function rotateCarousel(direction) {
      currentIndex += direction;
      updateCarousel();
    }

    // 觸控與滑鼠手勢
    let startX = 0;
    let isDragging = false;

    function handleStart(e) {
      isDragging = true;
      startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    }

    function handleEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      const endX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
      const diffX = endX - startX;

      if (Math.abs(diffX) > 30) {
        if (diffX < 0) rotateCarousel(1);
        else rotateCarousel(-1);
      }
    }

    stage.addEventListener('mousedown', handleStart);
    stage.addEventListener('mouseup', handleEnd);
    stage.addEventListener('touchstart', handleStart, { passive: true });
    stage.addEventListener('touchend', handleEnd, { passive: true });

    // 燈箱功能
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }
  </script>

</body>
</html>
